<!DOCTYPE html>
<html>
<head>
    <title>Event Booking Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f3e9;
        }
        .booking-container {
            width: 420px;
            margin: 60px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px gray;
        }
        h2 {
            text-align: center;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: orange;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: darkorange;
        }
        .error {
            color: red;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="booking-container">
    <h2>Event Booking Form</h2>
    <form onsubmit="return validateBooking()">
        <label>Full Name:</label>
        <input type="text" id="name">
        <div class="error" id="nameError"></div>

        <label>Email:</label>
        <input type="text" id="email">
        <div class="error" id="emailError"></div>

        <label>Phone Number:</label>
        <input type="tel" id="phone">
        <div class="error" id="phoneError"></div>

        <label>Select Event:</label>
        <select id="event">
            <option value="">--Select Event--</option>
            <option value="conference">Conference</option>
            <option value="workshop">Workshop</option>
            <option value="concert">Concert</option>
        </select>
        <div class="error" id="eventError"></div>

        <label>Number of Tickets:</label>
        <input type="number" id="tickets" min="1">
        <div class="error" id="ticketError"></div>

        <label>Event Date:</label>
        <input type="date" id="date">
        <div class="error" id="dateError"></div>

        <button type="submit">Book Now</button>
    </form>
</div>

<script>
function validateBooking() {
    let valid = true;

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let event = document.getElementById("event").value;
    let tickets = document.getElementById("tickets").value;
    let date = document.getElementById("date").value;

    // Clear errors
    document.getElementById("nameError").innerHTML = "";
    document.getElementById("emailError").innerHTML = "";
    document.getElementById("phoneError").innerHTML = "";
    document.getElementById("eventError").innerHTML = "";
    document.getElementById("ticketError").innerHTML = "";
    document.getElementById("dateError").innerHTML = "";

    if (name === "") {
        document.getElementById("nameError").innerHTML = "Name is required";
        valid = false;
    }

    if (email === "" || !email.includes("@")) {
        document.getElementById("emailError").innerHTML = "Valid email required";
        valid = false;
    }

    if (phone === "" || phone.length < 10) {
        document.getElementById("phoneError").innerHTML = "Valid phone number required";
        valid = false;
    }

    if (event === "") {
        document.getElementById("eventError").innerHTML = "Please select an event";
        valid = false;
    }

    if (tickets === "" || tickets <= 0) {
        document.getElementById("ticketError").innerHTML = "Enter number of tickets";
        valid = false;
    }

    if (date === "") {
        document.getElementById("dateError").innerHTML = "Select a date";
        valid = false;
    }

    return valid;
}
</script>

</body>
</html>
